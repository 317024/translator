```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>「導」向世界｜雙語自動對話</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f7fa;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

.mode {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.mode h2 {
    margin-top: 0;
    font-size: 22px;
}

button {
    width: 100%;
    padding: 18px;
    margin-top: 10px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #222;
    color: white;
}

button:active {
    transform: scale(0.98);
}

.start {
    background: #1769aa;
    font-size: 23px;
    padding: 22px;
}

.stop {
    background: #b3261e;
    display: none;
}

.status {
    text-align: center;
    margin: 20px 0;
    font-size: 19px;
    min-height: 30px;
    font-weight: bold;
}

.result {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.label {
    font-size: 15px;
    color: #666;
    margin-bottom: 8px;
}

.text {
    font-size: 21px;
    line-height: 1.6;
    word-break: break-word;
}

.small {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: 25px;
}

.direction {
    text-align: center;
    font-size: 18px;
    margin-top: 10px;
    color: #1769aa;
}
</style>
</head>

<body>

<div class="container">

<h1>「導」向世界</h1>

<div class="subtitle">
雙語自動對話翻譯助手
</div>

<div class="mode">

<h2>🗣️ 雙向對話模式</h2>

<div class="direction" id="direction">
準備開始
</div>

<button
class="start"
id="startButton"
onclick="startConversation()">
🎤 開始雙向對話
</button>

<button
class="stop"
id="stopButton"
onclick="stopConversation()">
⏹️ 停止對話
</button>

</div>

<div class="status" id="status">
請按「開始雙向對話」
</div>

<div class="result">

<div class="label">
你說：
</div>

<div class="text" id="original">
尚未開始
</div>

</div>

<div class="result">

<div class="label">
翻譯結果：
</div>

<div class="text" id="translated">
尚未翻譯
</div>

</div>

<div class="small">
目前版本需要網路連線
</div>

</div>


<script>

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* ================================
   全域變數
================================ */

let conversationRunning = false;

let currentTurn = "zh";

let recognition = null;

let lastTranslation = "";

let lastVoiceLanguage = "";


/* ================================
   開始雙向對話
================================ */

function startConversation() {

    if (!SpeechRecognition) {

        document.getElementById("status").innerText =
            "⚠️ 此瀏覽器不支援語音辨識，請使用 iPhone Safari。";

        return;
    }


    conversationRunning = true;

    currentTurn = "zh";


    document.getElementById("startButton").style.display =
        "none";

    document.getElementById("stopButton").style.display =
        "block";


    document.getElementById("status").innerText =
        "🎤 請說中文";


    document.getElementById("direction").innerText =
        "🇨🇳 中文 → 🇬🇧 English";


    unlockSpeech();


    setTimeout(function() {

        listen();

    }, 500);

}


/* ================================
   停止
================================ */

function stopConversation() {

    conversationRunning = false;


    if (recognition) {

        try {

            recognition.stop();

        }

        catch (error) {

            console.log(error);

        }

    }


    window.speechSynthesis.cancel();


    document.getElementById("startButton").style.display =
        "block";

    document.getElementById("stopButton").style.display =
        "none";


    document.getElementById("status").innerText =
        "⏹️ 對話已停止";


    document.getElementById("direction").innerText =
        "準備開始";

}


/* ================================
   開始聆聽
================================ */

function listen() {

    if (!conversationRunning) {
        return;
    }


    recognition =
        new SpeechRecognition();


    if (currentTurn === "zh") {

        recognition.lang =
            "zh-TW";

        document.getElementById("status").innerText =
            "🎤 請說中文";

        document.getElementById("direction").innerText =
            "🇨🇳 中文 → 🇬🇧 English";

    }

    else {

        recognition.lang =
            "en-US";

        document.getElementById("status").innerText =
            "🎤 Please speak English";

        document.getElementById("direction").innerText =
            "🇬🇧 English → 🇨🇳 中文";

    }


    recognition.interimResults =
        false;

    recognition.continuous =
        false;


    try {

        recognition.start();

    }

    catch (error) {

        console.log(error);

    }


    recognition.onresult =
        async function(event) {

            const text =
                event.results[0][0].transcript;


            document.getElementById("original").innerText =
                text;


            document.getElementById("status").innerText =
                "🌐 正在翻譯...";


            let languagePair;

            let voiceLanguage;


            if (currentTurn === "zh") {

                languagePair =
                    "zh-TW|en-GB";

                voiceLanguage =
                    "en-US";

            }

            else {

                languagePair =
                    "en-US|zh-TW";

                voiceLanguage =
                    "zh-TW";

            }


            const translated =
                await translateText(
                    text,
                    languagePair
                );


            if (!conversationRunning) {
                return;
            }


            if (translated) {

                document.getElementById("translated").innerText =
                    translated;


                lastTranslation =
                    translated;


                lastVoiceLanguage =
                    voiceLanguage;


                document.getElementById("status").innerText =
                    "🔊 正在播放翻譯結果...";


                speakText(
                    translated,
                    voiceLanguage,
                    function() {

                        if (!conversationRunning) {
                            return;
                        }


                        /*

                        中文說完
                        → 換英文

                        英文說完
                        → 換中文

                        */

                        if (currentTurn === "zh") {

                            currentTurn =
                                "en";

                        }

                        else {

                            currentTurn =
                                "zh";

                        }


                        setTimeout(function() {

                            listen();

                        }, 800);

                    }

                );

            }

            else {

                document.getElementById("status").innerText =
                    "⚠️ 翻譯失敗，準備再試一次。";


                setTimeout(function() {

                    listen();

                }, 1500);

            }

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            if (!conversationRunning) {
                return;
            }


            if (
                event.error ===
                "not-allowed"
            ) {

                document.getElementById("status").innerText =
                    "⚠️ 請允許 Safari 使用麥克風。";

                return;

            }


            if (
                event.error ===
                "no-speech"
            ) {

                document.getElementById("status").innerText =
                    "⚠️ 沒有聽到聲音，再試一次...";


                setTimeout(function() {

                    listen();

                }, 1000);


                return;

            }


            document.getElementById("status").innerText =
                "⚠️ 語音辨識發生問題：" +
                event.error;

        };

}


/* ================================
   翻譯
================================ */

async function translateText(
    text,
    languagePair
) {

    try {

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=" +
            encodeURIComponent(languagePair);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            data &&
            data.responseData &&
            data.responseData.translatedText
        ) {

            return data.responseData.translatedText;

        }


        return null;

    }

    catch (error) {

        console.log(error);

        return null;

    }

}


/* ================================
   語音播放
================================ */

function speakText(
    text,
    language,
    onFinished
) {

    if (!window.speechSynthesis) {

        document.getElementById("status").innerText =
            "⚠️ 此裝置不支援語音播放。";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        language;


    utterance.rate =
        0.9;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    utterance.onstart =
        function() {

            document.getElementById("status").innerText =
                "🔊 正在播放翻譯結果...";

        };


    utterance.onend =
        function() {

            if (onFinished) {

                onFinished();

            }

        };


    utterance.onerror =
        function(event) {

            console.log(
                "Speech synthesis error:",
                event
            );


            document.getElementById("status").innerText =
                "⚠️ 語音播放失敗";


            if (onFinished) {

                setTimeout(
                    onFinished,
                    1000
                );

            }

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* ================================
   iPhone Safari 語音啟用
================================ */

function unlockSpeech() {

    if (!window.speechSynthesis) {
        return;
    }


    const utterance =
        new SpeechSynthesisUtterance(
            " "
        );


    utterance.volume =
        0;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        utterance
    );

}

</script>

</body>
</html>
