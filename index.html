<style>

<body>

<div class="container">

<h1>「導」向世界</h1>

<div class="subtitle">
雙語自動對話翻譯助手
</div>


<div class="mode">

<h2>🗣️ 自動語言辨識</h2>

<div class="language" id="language">
尚未開始
</div>

<button
class="start"
id="startButton"
onclick="startConversation()">
🎤 開始雙向自動翻譯
</button>

class="stop"
id="stopButton"
onclick="stopConversation()">
⏹️ 停止對話
</button>

<div
class="loading"
id="loading">
第一次使用需要載入語音辨識模型，請稍候……
</div>

</div>


<div class="status" id="status">
請按「開始雙向自動翻譯」
</div>


<div class="result">

<div class="label">
🎤 偵測到的原文
</div>

<div class="text" id="original">
尚未開始
</div>

</div>


<div class="result">

<div class="label">
🌐 翻譯結果
</div>

<div class="text" id="translated">
尚未翻譯
</div>

</div>


<div class="small">
需要網路連線<br>
語音辨識模型會在第一次使用時下載並快取
</div>

</div>


<script type="module">

/*
==================================================
載入 Transformers.js
==================================================
*/

import {
    pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


/*
==================================================
全域變數
==================================================
*/

let transcriber = null;

let conversationRunning = false;

let mediaRecorder = null;

let audioChunks = [];

let stream = null;


/*
==================================================
載入 Whisper
==================================================
*/

async function loadWhisper() {

    if (transcriber) {
        return true;
    }

    document.getElementById("loading").style.display =
        "block";

    document.getElementById("status").innerText =
        "🧠 正在載入自動語言辨識模型……";

    try {

        transcriber = await pipeline(
            "automatic-speech-recognition",
            "Xenova/whisper-tiny",
            {
                dtype: "q8"
            }
        );

        document.getElementById("loading").style.display =
            "none";

        return true;

    }

    catch (error) {

        console.error(error);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("status").innerText =
            "⚠️ 語音辨識模型載入失敗";

        return false;
    }

}


/*
==================================================
開始
==================================================
*/

window.startConversation = async function() {

    if (conversationRunning) {
        return;
    }


    conversationRunning = true;


    document.getElementById("startButton")
        .style.display = "none";

    document.getElementById("stopButton")
        .style.display = "block";


    document.getElementById("language")
        .innerText = "🔍 自動偵測語言";


    /*
    取得麥克風
    */

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "⚠️ 請允許網站使用麥克風";

        stopConversation();

        return;
    }


    /*
    載入 Whisper
    */

    const loaded =
        await loadWhisper();


    if (!loaded) {

        stopConversation();

        return;
    }


    document.getElementById("status").innerText =
        "🎤 請開始說話";


    /*
    開始第一次聆聽
    */

    listen();

};


/*
==================================================
停止
==================================================
*/

window.stopConversation = function() {

    conversationRunning = false;


    if (mediaRecorder) {

        try {
            mediaRecorder.stop();
        }

        catch(error) {}

        mediaRecorder = null;
    }


    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }


    window.speechSynthesis.cancel();


    document.getElementById("startButton")
        .style.display = "block";

    document.getElementById("stopButton")
        .style.display = "none";


    document.getElementById("language")
        .innerText = "已停止";


    document.getElementById("status")
        .innerText = "⏹️ 對話已停止";

};


/*
==================================================
開始錄音
==================================================
*/

function listen() {

    if (!conversationRunning) {
        return;
    }


    audioChunks = [];


    try {

        mediaRecorder =
            new MediaRecorder(stream);

    }

    catch(error) {

        console.error(error);

        document.getElementById("status")
            .innerText =
            "⚠️ 此瀏覽器不支援錄音功能";

        return;
    }


    mediaRecorder.ondataavailable =
        function(event) {

            if (event.data.size > 0) {

                audioChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        async function() {

            if (!conversationRunning) {
                return;
            }


            document.getElementById("status")
                .innerText =
                "🧠 正在辨識語言與文字……";


            const audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        mediaRecorder.mimeType
                    }
                );


            await processAudio(
                audioBlob
            );

        };


    mediaRecorder.start();


    document.getElementById("status")
        .innerText =
        "🎤 正在聆聽……";


    /*
    每次先錄 5 秒
    */

    setTimeout(function() {

        if (
            conversationRunning &&
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {

            mediaRecorder.stop();

        }

    }, 5000);

}


/*
==================================================
處理語音
==================================================
*/

async function processAudio(blob) {

    if (!conversationRunning) {
        return;
    }


    try {

        /*
        將錄音轉成 WAV
        */

        const audio =
            await blobToAudioData(blob);


        /*
        Whisper 自動辨識
        language 不指定
        → 自動偵測
        */

        const result =
            await transcriber(
                audio,
                {
                    return_timestamps: false
                }
            );


        const text =
            result.text.trim();


        if (!text) {

            document.getElementById("status")
                .innerText =
                "⚠️ 沒有聽清楚，再說一次";


            setTimeout(
                listen,
                500
            );

            return;
        }


        document.getElementById("original")
            .innerText = text;


        /*
        ==========================================
        判斷中文 / 英文
        ==========================================
        */

        const language =
            detectLanguage(text);


        if (language === "zh") {

            document.getElementById("language")
                .innerText =
                "🇨🇳 偵測到中文 → 自動翻譯成英文";

        }

        else {

            document.getElementById("language")
                .innerText =
                "🇬🇧 偵測到英文 → 自動翻譯成中文";

        }


        document.getElementById("status")
            .innerText =
            "🌐 正在翻譯……";


        /*
        翻譯
        */

        let pair;


        if (language === "zh") {

            pair = "zh-TW|en";

        }

        else {

            pair = "en|zh-TW";

        }


        const translated =
            await translateText(
                text,
                pair
            );


        if (!translated) {

            document.getElementById("status")
                .innerText =
                "⚠️ 翻譯失敗";


            setTimeout(
                listen,
                1000
            );

            return;
        }


        document.getElementById("translated")
            .innerText =
            translated;


        document.getElementById("status")
            .innerText =
            "🔊 正在播放翻譯結果……";


        /*
        播放
        */

        speakText(
            translated,
            language === "zh"
                ? "en-US"
                : "zh-TW",
            function() {

                if (!conversationRunning) {
                    return;
                }


                /*
                播放完後自動再次聆聽
                */

                setTimeout(
                    listen,
                    500
                );

            }
        );

    }

    catch(error) {

        console.error(error);

        document.getElementById("status")
            .innerText =
            "⚠️ 語音辨識發生問題";


        setTimeout(
            listen,
            1000
        );

    }

}


/*
==================================================
中文 / 英文判斷
==================================================
*/

function detectLanguage(text) {

    /*
    中文 Unicode 範圍
    */

    const chineseMatches =
        text.match(
            /[\u4e00-\u9fff]/g
        );


    const chineseCount =
        chineseMatches
            ? chineseMatches.length
            : 0;


    /*
    英文字母
    */

    const englishMatches =
        text.match(
            /[A-Za-z]/g
        );


    const englishCount =
        englishMatches
            ? englishMatches.length
            : 0;


    if (
        chineseCount >
        englishCount
    ) {

        return "zh";

    }


    return "en";

}


/*
==================================================
翻譯
==================================================
*/

async function translateText(
    text,
    languagePair
) {

    try {

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=" +
            encodeURIComponent(languagePair);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            data &&
            data.responseData &&
            data.responseData.translatedText
        ) {

            return data.responseData.translatedText;

        }


        return null;

    }

    catch(error) {

        console.error(error);

        return null;

    }

}


/*
==================================================
文字轉語音
==================================================
*/

function speakText(
    text,
    language,
    onFinished
) {

    if (
        !window.speechSynthesis
    ) {

        document.getElementById("status")
            .innerText =
            "⚠️ 此裝置不支援語音播放";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        language;


    utterance.rate =
        0.9;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    utterance.onend =
        function() {

            if (onFinished) {
                onFinished();
            }

        };


    utterance.onerror =
        function(error) {

            console.error(error);


            if (onFinished) {

                setTimeout(
                    onFinished,
                    500
                );

            }

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/*
==================================================
Blob → Float32Array
==================================================
*/

async function blobToAudioData(blob) {

    const arrayBuffer =
        await blob.arrayBuffer();


    const audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    /*
    Whisper 使用單聲道
    */

    const channel =
        audioBuffer.getChannelData(0);


    /*
    Whisper 需要 16000 Hz
    */

    if (
        audioBuffer.sampleRate === 16000
    ) {

        return channel;

    }


    /*
    重取樣
    */

    const ratio =
        16000 /
        audioBuffer.sampleRate;


    const newLength =
        Math.floor(
            channel.length * ratio
        );


    const result =
        new Float32Array(
            newLength
        );


    for (
        let i = 0;
        i < newLength;
        i++
    ) {

        const index =
            Math.floor(
                i / ratio
            );


        result[i] =
            channel[index];

    }


    return result;

}


/*
==================================================
頁面載入
==================================================
*/

window.addEventListener(
    "beforeunload",
    function() {

        if (stream) {

            stream.getTracks().forEach(
                track =>
                track.stop()
            );

        }

    }
);

</script>

</body>
</html>
