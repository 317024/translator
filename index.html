<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>「導」向世界｜雙語語音翻譯助手</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;

        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

        .mode {

            margin-top: 0;

            border: none;

            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:active {

        }

        .play-button {
            background: #1769aa;

        .result {

            font-size: 15px;

            font-size: 21px;

        }
    </style>
</head>

<body>

<div class="container">

    <h1>「導」向世界</h1>

    <div class="subtitle">
        雙語語音翻譯助手
    </div>

    <div class="mode">

        <h2>🇨🇳 中文 → 🇬🇧 English</h2>

        <button onclick="startTranslation('zh-TW', 'zh-TW|en-GB', 'en-US')">
            🎤 開始說中文
        </button>

    </div>


    <div class="mode">

        <h2>🇬🇧 English → 🇨🇳 中文</h2>

        <button onclick="startTranslation('en-US', 'en-US|zh-TW', 'zh-TW')">
            🎤 Speak English
        </button>

    </div>


    <div class="status" id="status">
        請選擇翻譯方向
    </div>


    <button
        id="playButton"
        class="play-button"
        onclick="playLastTranslation()">
        🔊 播放翻譯結果
    </button>


    <div class="result">

        <div class="label">
            你說：
        </div>

        <div class="text" id="original">
            尚未開始
        </div>

    </div>


    <div class="result">

        <div class="label">
            翻譯結果：
        </div>

        <div class="text" id="translated">
            尚未翻譯
        </div>

    </div>


    <div class="small">
        目前版本需要網路連線
    </div>

</div>


<script>

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let lastTranslation = "";
let lastVoiceLanguage = "";


/* ================================
   啟用 iPhone Safari 語音
================================ */

function unlockSpeech() {

    if (!window.speechSynthesis) {
        return;
    }

    const unlockUtterance =
        new SpeechSynthesisUtterance(" ");

    unlockUtterance.volume = 0;

    unlockUtterance.rate = 10;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        unlockUtterance
    );
}


/* ================================
   開始翻譯
================================ */

async function startTranslation(
    speechLanguage,
    languagePair,
    voiceLanguage
) {

    /* 使用者按下按鈕的瞬間先啟用語音 */
    unlockSpeech();


    if (!SpeechRecognition) {

        document.getElementById("status").innerText =
            "⚠️ 此瀏覽器不支援語音辨識，請改用 Safari。";

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        speechLanguage;


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    document.getElementById("status").innerText =
        "🎤 正在聽，請開始說話...";


    document.getElementById("playButton").style.display =
        "none";


    try {

        recognition.start();

    }

    catch (error) {

        document.getElementById("status").innerText =
            "⚠️ 無法開始麥克風，請再按一次。";

        return;

    }


    recognition.onresult =
        async function(event) {

            const text =
                event.results[0][0].transcript;


            document.getElementById("original").innerText =
                text;


            document.getElementById("status").innerText =
                "🌐 正在翻譯...";


            const translated =
                await translateText(
                    text,
                    languagePair
                );


            if (translated) {

                document.getElementById("translated").innerText =
                    translated;


                lastTranslation =
                    translated;


                lastVoiceLanguage =
                    voiceLanguage;


                document.getElementById("status").innerText =
                    "🔊 正在播放翻譯結果...";


                /* 嘗試自動播放 */
                speakText(
                    translated,
                    voiceLanguage
                );

            }

            else {

                document.getElementById("status").innerText =
                    "⚠️ 翻譯失敗，請再試一次。";

            }

        };


    recognition.onerror =
        function(event) {

            let message =
                "⚠️ 語音辨識發生問題：";


            if (event.error === "not-allowed") {

                message =
                    "⚠️ 請允許 Safari 使用麥克風。";

            }

            else if (event.error === "no-speech") {

                message =
                    "⚠️ 沒有聽到聲音，請再試一次。";

            }

            else {

                message +=
                    event.error;

            }


            document.getElementById("status").innerText =
                message;

        };


    recognition.onend =
        function() {

            if (
                document.getElementById("status").innerText ===
                "🎤 正在聽，請開始說話..."
            ) {

                document.getElementById("status").innerText =
                    "沒有聽到內容，請再試一次。";

            }

        };

}


/* ================================
   翻譯
================================ */

async function translateText(
    text,
    languagePair
) {

    try {

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=" +
            encodeURIComponent(languagePair);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            data &&
            data.responseData &&
            data.responseData.translatedText
        ) {

            return data.responseData.translatedText;

        }


        return null;

    }

    catch (error) {

        console.log(error);

        return null;

    }

}


/* ================================
   播放語音
================================ */

function speakText(
    text,
    language
) {

    if (!window.speechSynthesis) {

        document.getElementById("status").innerText =
            "⚠️ 此裝置不支援語音播放。";

        showPlayButton();

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang =
        language;


    utterance.rate =
        0.9;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    utterance.onstart =
        function() {

            document.getElementById("status").innerText =
                "🔊 正在播放翻譯結果...";

            document.getElementById("playButton").style.display =
                "none";

        };


    utterance.onend =
        function() {

            document.getElementById("status").innerText =
                "✅ 完成！可以再選擇一次翻譯。";

            document.getElementById("playButton").style.display =
                "none";

        };


    utterance.onerror =
        function(event) {

            console.log(
                "語音播放錯誤：",
                event
            );


            document.getElementById("status").innerText =
                "🔊 請按下面按鈕播放翻譯結果。";


            showPlayButton();

        };


    /* 確保 Safari 已經載入語音 */
    const voices =
        window.speechSynthesis.getVoices();


    window.speechSynthesis.speak(
        utterance
    );

}


/* ================================
   顯示手動播放按鈕
================================ */

function showPlayButton() {

    document.getElementById("playButton").style.display =
        "block";

}


/* ================================
   手動播放
================================ */

function playLastTranslation() {

    if (
        lastTranslation &&
        lastVoiceLanguage
    ) {

        speakText(
            lastTranslation,
            lastVoiceLanguage
        );

    }

}


/* ================================
   預先載入 Safari 語音
================================ */

if (
    window.speechSynthesis
) {

    window.speechSynthesis.getVoices();

    window.speechSynthesis.onvoiceschanged =
        function() {

            window.speechSynthesis.getVoices();

        };

}

</script>

</body>
</html>
