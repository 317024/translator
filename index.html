<body>

🗣️ 自動雙向對話
</h2>

class="language"

</div>

class="start"
id="startButton"
onclick="startConversation()">

🎤 開始自動對話

</button>

class="stop"

onclick="stopConversation()">

⏹️ 停止對話

id="translated">

需要網路連線

<script>


/*
========================================
基本設定
========================================
*/


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition = null;

let running = false;

let listening = false;


/*
========================================
開始
========================================
*/


function startConversation() {


    if (!SpeechRecognition) {

        document.getElementById("status")
        .innerText =
        "⚠️ 此瀏覽器不支援語音辨識，請使用 iPhone Safari。";

        return;

    }


    running = true;


    document.getElementById(
        "startButton"
    ).style.display = "none";


    document.getElementById(
        "stopButton"
    ).style.display = "block";


    document.getElementById(
        "language"
    ).innerText =
    "🔍 自動偵測語言";


    document.getElementById(
        "status"
    ).innerText =
    "🎤 請開始說話";


    unlockSpeech();


    listen();

}



/*
========================================
停止
========================================
*/


function stopConversation() {


    running = false;

    listening = false;


    if (recognition) {

        try {

            recognition.stop();

        }

        catch(error) {

            console.log(error);

        }

    }


    window.speechSynthesis.cancel();


    document.getElementById(
        "startButton"
    ).style.display = "block";


    document.getElementById(
        "stopButton"
    ).style.display = "none";


    document.getElementById(
        "language"
    ).innerText =
    "已停止";


    document.getElementById(
        "status"
    ).innerText =
    "⏹️ 對話已停止";

}



/*
========================================
開始聆聽
========================================
*/


function listen() {


    if (!running) {

        return;

    }


    if (listening) {

        return;

    }


    listening = true;


    recognition =
    new SpeechRecognition();


    /*
    這裡使用英文辨識器作為主要入口。

    接收到文字後，
    再利用文字內容判斷
    中文或英文。

    */


    recognition.lang =
    "en-US";


    recognition.continuous =
    false;


    recognition.interimResults =
    false;


    recognition.maxAlternatives =
    1;



    recognition.onstart =
    function() {

        document.getElementById(
            "status"
        ).innerText =
        "🎤 正在聆聽……";

    };



    recognition.onresult =
    async function(event) {


        listening = false;


        const text =
        event.results[0][0]
        .transcript
        .trim();


        if (!text) {

            restartListening();

            return;

        }


        document.getElementById(
            "original"
        ).innerText =
        text;


        /*
        ====================================
        自動判斷語言
        ====================================
        */


        const language =
        detectLanguage(text);


        /*
        中文
        */


        if (language === "zh") {


            document.getElementById(
                "language"
            ).innerText =
            "🇨🇳 偵測到中文";


        }


        /*
        英文
        */


        else {


            document.getElementById(
                "language"
            ).innerText =
            "🇬🇧 偵測到英文";

        }


        document.getElementById(
            "status"
        ).innerText =
        "🌐 正在翻譯……";


        /*
        ====================================
        決定翻譯方向
        ====================================
        */


        let languagePair;

        let voiceLanguage;


        if (language === "zh") {


            languagePair =
            "zh-TW|en";


            voiceLanguage =
            "en-US";


        }

        else {


            languagePair =
            "en|zh-TW";


            voiceLanguage =
            "zh-TW";

        }



        /*
        ====================================
        翻譯
        ====================================
        */


        const translated =
        await translateText(
            text,
            languagePair
        );


        if (!running) {

            return;

        }


        if (!translated) {


            document.getElementById(
                "status"
            ).innerText =
            "⚠️ 翻譯失敗，重新聆聽";


            restartListening();


            return;

        }


        document.getElementById(
            "translated"
        ).innerText =
        translated;


        /*
        ====================================
        播放
        ====================================
        */


        document.getElementById(
            "status"
        ).innerText =
        "🔊 正在播放翻譯結果……";


        speakText(
            translated,
            voiceLanguage,
            function() {

                if (!running) {

                    return;

                }


                setTimeout(
                    listen,
                    500
                );

            }
        );

    };



    recognition.onerror =
    function(event) {


        listening = false;


        console.log(
            "Speech recognition:",
            event.error
        );


        if (!running) {

            return;

        }


        if (
            event.error ===
            "not-allowed"
        ) {


            document.getElementById(
                "status"
            ).innerText =
            "⚠️ 請允許 Safari 使用麥克風";


            return;

        }


        if (
            event.error ===
            "no-speech"
        ) {


            document.getElementById(
                "status"
            ).innerText =
            "🎤 沒有聽到聲音，再試一次";


            setTimeout(
                listen,
                500
            );


            return;

        }


        setTimeout(
            listen,
            1000
        );

    };



    recognition.onend =
    function() {


        listening = false;


        /*
        如果沒有收到結果，
        自動重新聆聽。
        */


        if (running) {

            setTimeout(
                listen,
                300
            );

        }

    };


    try {

        recognition.start();

    }

    catch(error) {

        console.log(error);

        listening = false;

    }

}



/*
========================================
重新聆聽
========================================
*/


function restartListening() {


    if (!running) {

        return;

    }


    setTimeout(
        listen,
        600
    );

}



/*
========================================
判斷中文 / 英文
========================================
*/


function detectLanguage(text) {


    /*
    中文字數
    */


    const chinese =
    (
        text.match(
            /[\u4e00-\u9fff]/g
        ) || []
    ).length;


    /*
    英文字母
    */


    const english =
    (
        text.match(
            /[A-Za-z]/g
        ) || []
    ).length;


    /*
    中文比較多
    */


    if (
        chinese > english
    ) {

        return "zh";

    }


    /*
    否則當成英文
    */


    return "en";

}



/*
========================================
翻譯 API
========================================
*/


async function translateText(
    text,
    languagePair
) {


    try {


        const url =
        "https://api.mymemory.translated.net/get?q="
        +
        encodeURIComponent(text)
        +
        "&langpair="
        +
        encodeURIComponent(languagePair);


        const response =
        await fetch(url);


        const data =
        await response.json();


        if (
            data &&
            data.responseData &&
            data.responseData.translatedText
        ) {


            return
            data.responseData.translatedText;

        }


        return null;


    }

    catch(error) {


        console.log(error);


        return null;

    }

}



/*
========================================
語音播放
========================================
*/


function speakText(
    text,
    language,
    onFinished
) {


    if (
        !window.speechSynthesis
    ) {


        document.getElementById(
            "status"
        ).innerText =
        "⚠️ 此裝置不支援語音播放";


        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(
        text
    );


    utterance.lang =
    language;


    utterance.rate =
    0.9;


    utterance.pitch =
    1;


    utterance.volume =
    1;


    utterance.onend =
    function() {


        if (onFinished) {

            onFinished();

        }

    };


    utterance.onerror =
    function(error) {


        console.log(
            "Speech error:",
            error
        );


        if (onFinished) {

            setTimeout(
                onFinished,
                500
            );

        }

    };


    window.speechSynthesis.speak(
        utterance
    );

}



/*
========================================
iPhone Safari 語音啟用
========================================
*/


function unlockSpeech() {


    if (
        !window.speechSynthesis
    ) {

        return;

    }


    const utterance =
    new SpeechSynthesisUtterance(
        " "
    );


    utterance.volume =
    0;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        utterance
    );

}


</script>
